[project]
name = "jarvis-mcp"
version = "0.1.0"
description = "AI assistant MCP server — unifies Claude intelligence with OS control, proactive discovery, and self-improvement"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "click",
    "toml",
    "sqlite-utils",
    "bcrypt",
    "PyJWT",
]

[project.scripts]
jarvis-mcp = "src.main:cli"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
